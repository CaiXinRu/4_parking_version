<!doctype html>
<html>
<head>
<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://googleapis.com" rel="stylesheet">
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/style.css">
	<title>微程式資訊 Microprogram｜停車場繳費機</title>
</head>

<body>
	<div id="main-container">
		<header>
			<div id="header-inner">
				<div class="time"><span>2025-09-15</span><span>17:20</span></div>
				<div class="name"><span><img src="images/c-logo.png" alt=""/></span></div>
				<div class="top-tool">
					<ul>
						<li><a href=""><i><img src="images/contact-icon.svg" alt=""/></i>聯絡客服</a></li>
						<li><a href=""><i><img src="images/language-icon.svg" alt=""/></i>語系</a></li>
					</ul>
				</div>
			</div>			
			<div id="header-title">
				<div>南山新市園區C棟停車場</div>
			</div>
			<div class="header-pic"><img class="header-mask" src="images/header-bg.png" width="768" height="190" alt=""/></div>	
		</header>
		<main class="nor">			
			<h2>請點選支付方式</h2>
			<div id="payment-out">
				<div id="payment-bt-container">
					<ul class="scroll">
						<li>
							<a href="" class="card">
								<span>
									<svg xmlns="http://www.w3.org/2000/svg">
										<rect rx="23" ry="23" class="line" height="104%" width="104%" stroke-linejoin="round"/>
									</svg><i></i>
								</span>信用卡
							</a>
							<div class="payment-list-container">
								<p>插入卡片</p>
								<p class="pm-mark">
									<span><img src="images/payment-visa.png" alt=""/></span>
									<span><img src="images/payment-master.png" alt=""/></span>
									<span><img src="images/payment-jcb.png" alt=""/></span>
								</p>
							</div>
						</li>
						<li>
							<a href="" class="iccard">
								<span>
									<svg xmlns="http://www.w3.org/2000/svg">
										<rect rx="23" ry="23" class="line" height="104%" width="104%" stroke-linejoin="round"/>
									</svg><i></i>
								</span>電子票證
							</a>
							<div class="payment-list-container">
								<p>放上卡片感應</p>
								<p class="pm-mark">
									<span><img src="images/payment-easycard.png" alt=""/></span>
									<span><img src="images/payment-ipass.png" alt=""/></span>
									<span><img src="images/payment-icash.png" alt=""/></span>
								</p>
							</div>
						</li>
						<li>
							<a href="" class="mobile">
								<span>
									<svg xmlns="http://www.w3.org/2000/svg">
										<rect rx="23" ry="23" class="line" height="104%" width="104%" stroke-linejoin="round"/>
									</svg><i></i>
								</span>手機感應支付
							</a>
							<div class="payment-list-container">
								<p>靠近感應區</p>
								<p class="pm-mark">
									<span><img src="images/payment-apple.png" alt=""/></span>
									<span><img src="images/payment-google.png" alt=""/></span>
									<span><img src="images/payment-sum.png" alt=""/></span>
								</p>
							</div>
						</li>
						<li>
							<a href="" class="qrcode">
								<span>
									<svg xmlns="http://www.w3.org/2000/svg">
										<rect rx="23" ry="23" class="line" height="104%" width="104%" stroke-linejoin="round"/>
									</svg><i></i>
								</span>手機感應支付
							</a>
							<div class="payment-list-container">
								<p>對準掃描器</p>
								<p class="pm-mark">
									<span><img src="images/payment-easw.png" alt=""/></span>
									<span><img src="images/payment-line.png" alt=""/></span>
									<span><img src="images/payment-street.png" alt=""/></span>
								</p>
							</div>
						</li>
					</ul>
				</div>
			</div>	
		</main>
		<footer class="inner">		  
			<div id="pay-list-container">				
				<div id="pat-list-inner">
					<p><img src="images/pay_easycard.png" alt=""/></p>
					<p><img src="images/pay_easypay.png" alt=""/></p>
					<p><img src="images/pay_ipass.png" alt=""/></p>
					<p><img src="images/pay_icash2.0.png" alt=""/></p>
					<p><img src="images/pay_linepay.png" alt=""/></p>
					<p><img src="images/pay_street.png" alt=""/></p>
					<p><img src="images/pay_twpay.png" alt=""/></p>
					<p><img src="images/pay_applepay.png" alt=""/></p>
					<p><img src="images/pay_googlepay.png" alt=""/></p>
					<p><img src="images/pay_samsungpay.png" alt=""/></p>
					<p><img src="images/pay_cash.png" alt=""/></p>
					<p><img src="images/pay_creditcard.png" alt=""/></p>
				</div>
			</div>
			<div class="footer-pic"><img class="footer-mask" src="images/footer-bg.png" width="768" height="246" alt=""/></div>		  
		</footer>
	</div>
</body>
</html>
